[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-powered-micro-influencer-outreach"
version = "0.1.0"
description = "A modular foundation for influencer discovery and outreach workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.39,<2.0",
  "pandas>=2.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "groq>=0.30,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["outreach*"]
